<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar | RetLia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --w:#fff; --g50:#FAFAF9; --g100:#F3F3F1; --g200:#E7E7E4; --g300:#D2D2CE; --g400:#A9A9A4;
  --g500:#7C7C77; --g600:#5A5A56; --g700:#3B3B38; --g800:#232322; --g900:#121211; --k:#0A0A0A;
  --mint:#D5EFDF; --mint-ink:#2E6A4B; --sun:#F7EAAE; --sun-ink:#7A6410;
  --display:"Inter Tight","Inter",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--g100);color:var(--g900);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}

.logo{font:700 30px/1 var(--display);letter-spacing:-.04em;display:inline-flex;align-items:baseline}
.logo .i{position:relative;display:inline-block}
.logo .i::after{content:"";position:absolute;width:.2em;height:.2em;border-radius:50%;background:var(--mint-ink);left:50%;top:-.02em;transform:translateX(-52%)}

.page{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr;gap:12px;padding:12px}

/* painel escuro */
.side{position:relative;background:var(--k);color:#fff;border-radius:36px;padding:34px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.side::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 340px at 85% 0%,rgba(255,255,255,.12),transparent 70%),radial-gradient(520px 300px at 0% 100%,rgba(213,239,223,.14),transparent 70%)}
.side>*{position:relative}
.side>.mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.side h1{font:700 clamp(26px,2.8vw,40px)/1.1 var(--display);letter-spacing:-.03em}
.side h1 em{font-style:normal;color:var(--g500)}
.side .back{display:inline-flex;align-items:center;gap:10px;font:600 13px var(--display);color:var(--g300);transition:color .3s}
.side .back:hover{color:#fff}
.back .a{width:30px;height:30px;border-radius:50%;background:#fff;color:var(--k);display:grid;place-items:center;transition:background .4s}
.back:hover .a{background:var(--mint)}
.back .a svg{width:14px;height:14px;transform:rotate(-135deg)}

/* formulário */
.main{display:grid;place-items:center;padding:28px}
.card{width:100%;max-width:380px}
.card h2{font:700 clamp(24px,2.1vw,30px)/1.1 var(--display);letter-spacing:-.03em}
.card h2{margin-bottom:22px}
.fld{margin-bottom:16px}
.fld label{display:block;font:600 13px var(--display);color:var(--g700);margin-bottom:8px}
.inp{position:relative}
.inp input{width:100%;height:50px;border-radius:16px;border:1.5px solid transparent;background:#fff;padding:0 20px;font-weight:500;outline:none;transition:border-color .3s,box-shadow .3s}
.inp input::placeholder{color:var(--g400)}
.inp input:focus{border-color:var(--g900);box-shadow:0 0 0 5px rgba(0,0,0,.05)}
.fld.err input{border-color:#C26A5A}
.fld .msg{display:none;margin-top:8px;font-size:13px;font-weight:500;color:#A2442F}
.fld.err .msg{display:block}
.eye{position:absolute;right:8px;top:6px;width:38px;height:38px;border-radius:14px;display:grid;place-items:center;color:var(--g500);transition:background .3s,color .3s}
.eye:hover{background:var(--g100);color:var(--g900)}
.eye svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;justify-content:space-between;align-items:center;margin:4px 0 26px;font-size:14px;font-weight:500;color:var(--g600)}
.ck{display:inline-flex;align-items:center;gap:10px;cursor:pointer}
.ck input{position:absolute;opacity:0}
.ck i{width:22px;height:22px;border-radius:8px;background:#fff;border:1.5px solid var(--g300);display:grid;place-items:center;transition:.3s}
.ck i svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.5);transition:.3s var(--ease)}
.ck input:checked+i{background:var(--k);border-color:var(--k)}
.ck input:checked+i svg{opacity:1;transform:none}
.ck input:focus-visible+i{box-shadow:0 0 0 4px rgba(0,0,0,.1)}
.row a{font-weight:600;color:var(--g900);transition:opacity .3s}
.row a:hover{opacity:.6}

.btn{--bg:var(--k);--fg:#fff;--hov:var(--mint);--hfg:var(--k);position:relative;display:flex;align-items:center;justify-content:space-between;width:100%;height:54px;padding:0 7px 0 24px;border-radius:99px;background:var(--bg);color:var(--fg);font:700 15px/1 var(--display);letter-spacing:-.02em;overflow:hidden;isolation:isolate;transition:transform .5s var(--ease),box-shadow .5s var(--ease),color .2s .26s}
.btn .a{position:relative;width:40px;height:40px;border-radius:50%;background:#fff;color:var(--k);display:grid;place-items:center;overflow:hidden}
.btn .a svg{width:20px;height:20px;transition:transform .55s var(--ease)}
.btn .a svg+svg{position:absolute;transform:translate(-160%,160%)}
.btn:hover .a svg:first-child{transform:translate(160%,-160%)}
.btn:hover .a svg+svg{transform:none}
.btn::before{content:"";position:absolute;z-index:-1;right:7px;top:50%;width:40px;height:40px;margin-top:-20px;border-radius:50%;background:var(--hov);transform:scale(0);transition:transform .7s var(--ease)}
.btn:hover::before{transform:scale(11)}
.btn:hover{color:var(--hfg);box-shadow:0 18px 40px -14px rgba(0,0,0,.35)}
.btn::before{display:none}
.btn .a svg+svg{display:none}
.btn:hover .a svg:first-child{transform:none}
.btn{transition:background .35s,color .35s}
.btn:hover{background:var(--hov);color:var(--hfg);box-shadow:none}
.btn:active{transform:none}

.notice{display:none;margin-top:18px;background:var(--sun);color:var(--sun-ink);border-radius:20px;padding:16px 18px;font-size:14px;font-weight:500;line-height:1.5}
.notice.on{display:block;animation:in .5s var(--ease)}
@keyframes in{from{opacity:0}}
.foot{margin-top:22px;font-size:13px;letter-spacing:-.02em;color:var(--g600);font-weight:500}
.foot a{color:var(--g900);font-weight:600}
.foot a:hover{opacity:.6}

@media(max-width:900px){
  .page{grid-template-columns:1fr}
  .side{padding:28px;min-height:auto;gap:36px;border-radius:30px}
  .side h1{max-width:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></symbol>
</svg>

<div class="page">
  <aside class="side">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <a href="index.html" class="logo" aria-label="RetLia">RetL<span class="i">ı</span>a</a>
      <a href="index.html" class="back"><span class="a"><svg><use href="#arr"/></svg></span>Voltar ao site</a>
    </div>
    <div class="mid"><h1>Retificar nunca foi<br>tão <em>Fácil.</em></h1></div>
  </aside>

  <main class="main">
    <div class="card">
      <h2>Entrar</h2>
      <form id="f" novalidate>
        <div class="fld" id="fe">
          <label for="email">E-mail</label>
          <div class="inp"><input id="email" name="email" type="email" autocomplete="username" placeholder="voce@consultoria.com.br"></div>
          <div class="msg">Informe um e-mail válido.</div>
        </div>
        <div class="fld" id="fp">
          <label for="pass">Senha</label>
          <div class="inp">
            <input id="pass" name="password" type="password" autocomplete="current-password" placeholder="Sua senha">
            <button type="button" class="eye" id="eye" aria-label="Mostrar senha"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
          <div class="msg">Informe sua senha.</div>
        </div>
        <div class="row">
          <label class="ck"><input type="checkbox" name="remember"><i><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></i>Manter conectado</label>
          <a href="#" id="forgot">Esqueci a senha</a>
        </div>
        <button class="btn" type="submit"><span class="t">Entrar na plataforma</span><span class="a"><svg><use href="#arr"/></svg><svg><use href="#arr"/></svg></span></button>
        <div class="notice" id="notice" role="status"></div>
      </form>
      <div class="foot">Ainda não tem acesso? O cadastro é por convite. <a class="wa" href="https://wa.me/5548988598361" target="_blank" rel="noopener">Fale com a equipe</a></div>
    </div>
  </main>
</div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const f=$('#f'),email=$('#email'),pass=$('#pass'),notice=$('#notice');
const say=t=>{notice.textContent=t;notice.classList.add('on')};
$('#eye').addEventListener('click',()=>{
  const show=pass.type==='password';
  pass.type=show?'text':'password';
  $('#eye').setAttribute('aria-label',show?'Ocultar senha':'Mostrar senha');
});
[email,pass].forEach(i=>i.addEventListener('input',()=>i.closest('.fld').classList.remove('err')));
$('#forgot').addEventListener('click',e=>{
  e.preventDefault();
  say('Para redefinir a senha, fale com o administrador da sua consultoria ou com a equipe do RetLia.');
});
f.addEventListener('submit',e=>{
  e.preventDefault();
  notice.classList.remove('on');
  const okE=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim());
  const okP=pass.value.length>0;
  $('#fe').classList.toggle('err',!okE);
  $('#fp').classList.toggle('err',!okP);
  if(!okE||!okP)return;
  // TODO: enviar email/senha para a API de autenticação quando a plataforma existir.
  say('A autenticação será ativada junto com a plataforma. Por enquanto, o acesso é por convite: fale com a equipe.');
});
})();
</script>
</body>
</html>
